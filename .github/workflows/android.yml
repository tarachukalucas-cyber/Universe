name: Universe Android launcher build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Universe and runtime source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;25.2.9519653"

      - name: Set up Rust for native runtime components
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Apply Universe branding to the upstream runtime
        run: python3 scripts/patch_runtime.py

      - name: Build the ARM64 debug APK
        working-directory: runtime/ZalithLauncher2
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/25.2.9519653
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :ZalithLauncher:assembleDebug -Darch=arm64

      - name: Upload Universe APK
        uses: actions/upload-artifact@v4
        with:
          name: universe-launcher-arm64-debug
          path: runtime/ZalithLauncher2/ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
