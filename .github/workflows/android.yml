name: Universe Android launcher build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Universe and runtime source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK platform and NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-37-ext2" "build-tools;37.0.0" "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Set up Rust for native runtime components
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: |
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Apply Universe branding to the upstream runtime
        run: python3 scripts/patch_runtime.py

      - name: Build the ARM64 debug APK
        working-directory: runtime/ZalithLauncher2
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :ZalithLauncher:assembleDebug -Darch=arm64

      - name: Upload Universe APK
        uses: actions/upload-artifact@v4
        with:
          name: universe-launcher-arm64-debug
          path: runtime/ZalithLauncher2/ZalithLauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
